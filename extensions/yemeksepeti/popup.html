<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Yemeksepeti Köprüsü</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 0; padding: 12px; color: #111; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { margin: 0 0 10px; color: #555; }
      .count { font-size: 22px; font-weight: 700; margin: 6px 0; }
      button { display: block; width: 100%; padding: 8px; margin-top: 6px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
      .primary { background: #e11d48; color: #fff; }
      .ghost { background: #f1f1f1; color: #333; }
      ul { list-style: none; padding: 0; margin: 8px 0 0; max-height: 160px; overflow: auto; font-size: 11px; color: #444; }
      li { padding: 2px 0; border-bottom: 1px solid #eee; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Yemeksepeti Köprüsü</h1>
    <p>Panel açıkken gelen sipariş verisini sisteminize aktarır.</p>
    <fieldset style="border:1px solid #ddd;border-radius:6px;padding:8px;margin:0 0 10px">
      <legend style="font-size:12px;color:#555">Sistem bağlantısı</legend>
      <input id="serverUrl" placeholder="https://siteniz.vercel.app" style="width:100%;box-sizing:border-box;padding:6px;margin-bottom:6px" />
      <input id="token" type="password" placeholder="Bağlantı anahtarı" style="width:100%;box-sizing:border-box;padding:6px" />
      <button class="ghost" id="save">Kaydet</button>
      <div id="sync" style="font-size:12px;margin-top:6px;color:#555">Bağlantı kurulmadı.</div>
    </fieldset>
    <div class="count" id="count">…</div>
    <button class="primary" id="dlMasked">Örneği indir (kişisel bilgiler gizli)</button>
    <button class="ghost" id="dlRaw">Ham indir (sadece kendiniz için)</button>
    <button class="ghost" id="clear">Temizle</button>
    <ul id="list"></ul>
    <script src="popup.js"></script>
  </body>
</html>
